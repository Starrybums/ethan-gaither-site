<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Ethan Gaither</title>
<meta name="description" content="That page is not here. Go back to the portfolio.">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F5F1EA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121110" media="(prefers-color-scheme: dark)">
<!-- Root-relative paths on purpose: a host serves this file at whatever URL was missing.
     If the site lives in a sub-folder, prefix the three paths below with that folder. -->
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..500;1,9..144,300..400&family=Inter+Tight:wght@400..500&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..500;1,9..144,300..400&family=Inter+Tight:wght@400..500&display=swap"></noscript>
<link rel="stylesheet" href="/styles.css">
<script src="/site.config.js" defer></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var S = window.SITE || {};
  Array.prototype.forEach.call(document.querySelectorAll('[data-site]'), function (el) {
    var v = S[el.getAttribute('data-site')];
    if (typeof v === 'string' && v) el.textContent = v;
  });
  if (S.name) document.title = 'Page not found — ' + S.name;
});
</script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="site-header">
  <div class="wrap bar">
    <a class="brand" href="/" data-site="name">Ethan Gaither</a>
  </div>
</header>
<main id="main">
  <section class="hero" aria-labelledby="nf-title">
    <div class="wrap">
      <p class="eyebrow">Error 404</p>
      <h1 id="nf-title">That page is not <em>here.</em></h1>
      <p class="lede">The link may be old or mistyped. The portfolio is one page, and everything on it is a tap away.</p>
      <p class="actions"><a class="btn btn--solid" href="/">Back to the portfolio</a></p>
    </div>
  </section>
</main>
<footer class="site-footer">
  <div class="wrap">
    <p><span data-site="name">Ethan Gaither</span> · <span data-site="location">Battle Ground, Washington</span></p>
    <p>Built by hand. No tracking.</p>
  </div>
</footer>
</body>
</html>
